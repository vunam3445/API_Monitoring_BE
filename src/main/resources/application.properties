spring.application.name=API Monitoring

//DB
# Thông tin k?t n?i Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/API_Monitoring
spring.datasource.username=postgres
spring.datasource.password=123456

# Cấu hình Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.web.pageable.serialization-mode=via-dto

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

google.client-id=${GOOGLE_CLIENT_ID}

# REDIS CONFIGURATION (Caching)
# ===============================
# M?c ??nh k?t n?i t?i Redis ch?y trên máy (Local) ho?c Docker
spring.data.redis.host=localhost
spring.data.redis.port=6379
# N?u Redis có m?t kh?u thì ?i?n vào ?ây, không thì ?? tr?ng
spring.data.redis.password=
# Ki?u Cache s? d?ng là Redis
spring.cache.type=redis
# Th?i gian s?ng m?c ??nh c?a Cache (ví d?: 10 phút)
spring.cache.redis.time-to-live=600000
# Cho phép l?u giá tr? null vào cache (tránh Cache Penetration)
spring.cache.redis.cache-null-values=true

# ===============================
# SECURITY CONFIGURATION
# ===============================
# T?t m?c ??nh c?a Spring Boot ?? t? c?u hình theo JWT
spring.main.allow-bean-definition-overriding=true


spring.aop.proxy-target-class=true

# CLOUDINARY CONFIGURATION
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# RABBITMQ CONFIGURATION
# ===============================
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.task.scheduling.pool.size=5

# ===============================
# VNPAY CONFIGURATION
# ===============================
vnpay.tmnCode=${VNPAY_TMN_CODE}
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.payUrl=${VNPAY_PAY_URL}
vnpay.returnUrl=${VNPAY_RETURN_URL}

# ===============================
# MAIL CONFIGURATION (Brevo SMTP)
# ===============================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${SMTP_BREVO_USERNAME}
spring.mail.password=${SMTP_BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
notification.from-email=nam0302200301@gmail.com

# ==========================================
# PERFORMANCE OPTIMIZATION & CONCURRENCY
# ==========================================
# Tăng số kết nối tối đa xuống Database (HikariCP)
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10

# Cấu hình mặc định toàn cục cho các queue phát sinh sau này (an toàn & tiết kiệm)
# Mỗi listener sẽ override giá trị này bằng các thuộc tính riêng bên dưới
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5
# Mỗi thread xử lý tối đa 5 message cùng lúc, tránh quá tải RAM
spring.rabbitmq.listener.simple.prefetch=5

# ==========================================
# RABBITMQ PER-LISTENER CONCURRENCY TUNING
# ==========================================
# Cấu hình luồng tối ưu hóa riêng biệt theo đặc thù nghiệp vụ của từng Consumer.
# Nguyên lý: Tách cấu hình ra khỏi code (12-Factor App) để dễ dàng điều chỉnh
# mà không cần build lại ứng dụng. Tuân thủ SOLID Open/Closed Principle.
#
# MonitorWorker: Tác vụ I/O-Bound cực nặng, ping API liên tục 24/7
# Tối thiểu 5 thread sẵn sàng, tối đa 20 thread khi có nhiều monitor cần check đồng thời
# Giới hạn 20 đảm bảo không bao giờ chiếm quá 40% DB Connection Pool (50 connections)
app.rabbitmq.concurrency.monitor=5-20
#
# ApplicationLogConsumer: Tác vụ ghi log vào DB theo hoạt động server
# Tối thiểu 2, tối đa 4 thread để tránh Lock Contention khi ghi đồng thời vào 1 bảng
app.rabbitmq.concurrency.log=2-4
#
# SubscriptionExpiryConsumer: Tác vụ gửi email nhắc hết hạn, chỉ chạy lúc 7h sáng hàng ngày
# Chỉ cần 1 thread, tự động mở thêm 1 khi gửi email batch sáng sớm. Tránh SMTP throttling
app.rabbitmq.concurrency.expiry=1-2
#
# NotificationBroadcastConsumer: Tác vụ phát thông báo thời gian thực (SSE + Email)
# Chạy khi Admin gửi thông báo hoặc hệ thống phát sự kiện. 1-3 thread đủ phục vụ đột biến nhỏ
app.rabbitmq.concurrency.broadcast=1-3

# ACTUATOR CONFIGURATION
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
